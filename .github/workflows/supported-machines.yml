name: supported-machines

# Regenerates SUPPORTED_MACHINES.md.  The commit touches only that file, which
# is absent from the paths below, so it cannot trigger another run.
on:
  push:
    branches:
      - master
    paths:
      - 'src/wpc/**'
      - 'scripts/gen_supported_machines.py'
      - '.github/workflows/supported-machines.yml'
  schedule:
    - cron: '17 4 * * 1'
  workflow_dispatch:

permissions:
  contents: write

defaults:
  run:
    shell: bash

concurrency:
  group: supported-machines
  cancel-in-progress: false

jobs:
  update:
    name: Update
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      # Fails on a game definition macro, driver flag or macro arity the parser
      # does not know, and on an override that no longer matches.
      - name: Check the parser against the drivers
        run: python3 scripts/gen_supported_machines.py --self-test

      - name: Regenerate the page
        run: python3 scripts/gen_supported_machines.py --refresh

      - name: Commit if it changed
        run: |
          if git diff --quiet -- SUPPORTED_MACHINES.md; then
            echo "SUPPORTED_MACHINES.md is already up to date"
            exit 0
          fi
          git config user.name  'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add SUPPORTED_MACHINES.md
          git commit -m 'update SUPPORTED_MACHINES.md [skip ci]'
          git push
          git --no-pager diff --stat HEAD~1 -- SUPPORTED_MACHINES.md
